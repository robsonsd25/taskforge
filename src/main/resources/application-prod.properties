server.port=${PORT:8080}

# Banco H2 em memória para produção (Render)
spring.datasource.url=jdbc:h2:mem:taskforge
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=SA
spring.datasource.password=

# Hibernate: cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desativa o console do H2 em produção por segurança
spring.h2.console.enabled=false

# JWT
jwt.secret=taskforge-chave-super-secreta-com-no-minimo-32-caracteres-aqui
jwt.expiracao=86400000