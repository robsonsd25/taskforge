server.port=${PORT:8080}

# Conexão com o PostgreSQL do Render (variáveis de ambiente)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate vai criar e atualizar as tabelas automaticamente no Postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O console do H2 não faz sentido quando estamos usando Postgres
spring.h2.console.enabled=false

# JWT
jwt.secret=${JWT_SECRET:taskforge-chave-super-secreta-com-no-minimo-32-caracteres-aqui}
jwt.expiracao=86400000

# CORS (para o front que você vai criar no Cloudflare)
app.cors.origins=${APP_CORS_ORIGINS:*}