spring.application.name=taskforge

# PORT dinâmica: o Render injeta a variável PORT.
# Se não existir (local), usa 8082.
server.port=${PORT:8082}

# H2 em memória (para produção no Render Free).
# ATENÇÃO: os dados são perdidos a cada reinício/dormida do serviço.
spring.datasource.url=jdbc:h2:mem:taskforge
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=SA
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=taskforge-chave-super-secreta-com-no-minimo-32-caracteres-aqui
jwt.expiracao=86400000